[mcp_servers.shadcn]
command = "bun"
args = ["scripts/shadcn-mcp.ts"]
env_vars = ["REACTBITS_LICENSE_KEY", "REUI_LICENSE_KEY", "SHADCNBLOCKS_API_KEY", "SHADCNUIKIT_API_KEY", "SHADCN_STUDIO_EMAIL", "SHADCN_STUDIO_LICENSE_KEY", "EFFERD_REGISTRY_TOKEN"]
startup_timeout_sec = 60

[mcp_servers.reactbits_pro]
url = "https://mcp.reactbits.dev/mcp"
bearer_token_env_var = "REACTBITS_LICENSE_KEY"

[mcp_servers.reui]
url = "https://mcp.reui.io"
bearer_token_env_var = "REUI_LICENSE_KEY"
http_headers = { "X-Reui-Style" = "base-maia" }

[mcp_servers.shadcn_space]
url = "https://mcp.shadcnspace.com/mcp"
startup_timeout_sec = 60

[mcp_servers.shadcn_studio]
command = "bun"
args = ["scripts/shadcn-studio-mcp.ts"]
env_vars = ["SHADCN_STUDIO_EMAIL", "SHADCN_STUDIO_LICENSE_KEY"]
startup_timeout_sec = 60

[mcp_servers.shadcnuikit]
url = "https://shadcnuikit.com/api/mcp"
bearer_token_env_var = "SHADCNUIKIT_API_KEY"

[mcp_servers.motion]
url = "https://mcp.motion.dev"

[mcp_servers.next_devtools]
command = "bunx"
args = ["next-devtools-mcp@0.4.0"]
startup_timeout_sec = 60
